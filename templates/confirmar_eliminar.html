{% extends 'base.html' %}

{% block contenido %}
<h1 class="h3 mb-4 text-gray-800">Confirmar</h1>

<div class="card shadow mb-4">
    <div class="card-body">
        <p>¿Seguro que quieres eliminar <strong>{{ objeto }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url volver %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
